<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Страница не найдена</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050505; display: flex; justify-content: center; align-items: center; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }
    .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at center, transparent 20%, rgba(0, 0, 0, 0.8) 100%); }
    .card { position: relative; z-index: 10; width: 100%; max-width: 460px; padding: 48px 30px 32px; background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(40px) saturate(1.2); -webkit-backdrop-filter: blur(40px) saturate(1.2); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; gap: 20px; text-align: center; animation: cardIn 0.6s cubic-bezier(0.2, 0.9, 0.2, 1); }
    .error-code { font-size: 120px; font-weight: 800; color: #fff; letter-spacing: -4px; line-height: 1; text-shadow: 0 0 60px rgba(255, 255, 255, 0.15); animation: pulse 3s ease-in-out infinite; }
    .error-title { color: #fff; font-size: 24px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 4px; }
    .error-description { color: rgba(255, 255, 255, 0.45); font-size: 15px; line-height: 1.5; padding: 0 12px; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    .btn-main { width: 100%; height: 48px; background: #f0f0f0; border: none; border-radius: 12px; color: #0a0a0a; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s ease; text-decoration: none; display: flex; align-items: center; justify-content: center; }
    .btn-main:hover { background: #ffffff; transform: scale(1.01); }
    .btn-secondary { width: 100%; height: 48px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; color: rgba(255, 255, 255, 0.8); font-weight: 500; font-size: 15px; cursor: pointer; transition: 0.2s ease; text-decoration: none; display: flex; align-items: center; justify-content: center; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .divider { display: flex; align-items: center; gap: 12px; color: rgba(255, 255, 255, 0.25); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin: 4px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.08); }
    .info-box { color: rgba(255, 255, 255, 0.35); font-size: 13px; padding: 12px 14px; background: rgba(0, 0, 0, 0.25); border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .info-icon { font-size: 16px; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    @media (max-width: 480px) {
      .card { padding: 36px 20px 24px; }
      .error-code { font-size: 96px; letter-spacing: -3px; }
      .error-title { font-size: 20px; }
      .error-description { font-size: 14px; }
      .btn-group { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="fluidCanvas"></canvas>
  </div>
  <div class="vignette"></div>

  <div class="card">
    <div class="error-code">404</div>
    
    <div>
      <div class="error-title">Страница не найдена</div>
      <div class="error-description">Ссылка, которую вы ищете, не существует или была удалена. Возможно, вы ошиблись в адресе.</div>
    </div>

    <div class="divider">или</div>

    <div class="btn-group">
      <a href="/" class="btn-secondary">← На главную</a>
      <a href="/" class="btn-main">Создать ссылку</a>
    </div>

    <div class="info-box">
      <span class="info-icon">ℹ️</span>
      <span>Проверьте правильность введённого URL</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('fluidCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    ctx.imageSmoothingQuality = 'high';

    const SCALE = 4;
    const OW = 240, OH = 150;
    const RW = OW * SCALE, RH = OH * SCALE;
    const off = document.createElement('canvas');
    off.width = RW; off.height = RH;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.scale(SCALE, SCALE);

    const LUT = (() => {
      const stops = [
        [0.00,   0,   0,   0],
        [0.20,  42,   0,  66],
        [0.38, 140,   0, 135],
        [0.50, 236,   0, 168],
        [0.68, 230, 205,   8],
        [1.00, 255, 242, 130]
      ];
      const lut = new Uint8ClampedArray(256 * 3);
      for (let i = 0; i < 256; i++) {
        const t = i / 255;
        let s = 0;
        while (s < stops.length - 2 && t > stops[s + 1][0]) s++;
        const a = stops[s], b = stops[s + 1];
        const k = Math.min(1, Math.max(0, (t - a[0]) / ((b[0] - a[0]) || 1)));
        lut[i * 3]     = a[1] + (b[1] - a[1]) * k;
        lut[i * 3 + 1] = a[2] + (b[2] - a[2]) * k;
        lut[i * 3 + 2] = a[3] + (b[3] - a[3]) * k;
      }
      return lut;
    })();

    function blob(x, y, r, a) {
      const g = octx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,' + a + ')');
      g.addColorStop(0.45, 'rgba(255,255,255,' + (a * 0.75) + ')');
      g.addColorStop(0.8, 'rgba(255,255,255,' + (a * 0.22) + ')');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      octx.fillStyle = g;
      octx.beginPath();
      octx.arc(x, y, r, 0, Math.PI * 2);
      octx.fill();
    }

    const magenta = [];
    for (let i = 0; i < 8; i++) {
      magenta.push({
        x: Math.random() * OW,
        y: Math.random() * OH,
        vx: (Math.random() - 0.5) * 0.22,
        vy: (Math.random() - 0.5) * 0.22,
        r: 55 + Math.random() * 70,
        a: 0.16 + Math.random() * 0.10,
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 0.4
      });
    }

    function randomPart() {
      return {
        spin: (Math.random() - 0.5) * 0.02,
        dist: 6 + Math.random() * 16,
        baseR: 14 + Math.random() * 6,
        baseA: 0.45 + Math.random() * 0.15,
        wavePhase: Math.random() * Math.PI * 2
      };
    }

    const clump = { t: Math.random() * 100, parts: [] };
    for (let i = 0; i < 7; i++) {
      clump.parts.push({
        ang: Math.random() * Math.PI * 2,
        current: randomPart(),
        target: randomPart(),
        lerp: 0,
        lerpSpeed: 0.003 + Math.random() * 0.002
      });
    }

    const drops = [
      { bx: 0.78, by: 0.52, baseR: 13, baseA: 0.78, p: Math.random() * 10 },
      { bx: 0.62, by: 0.82, baseR: 10, baseA: 0.58, p: Math.random() * 10 }
    ];

    function lerp(a, b, t) { return a + (b - a) * t; }

    function drawFluid() {
      octx.globalCompositeOperation = 'source-over';
      octx.fillStyle = '#000';
      octx.fillRect(0, 0, OW, OH);
      octx.globalCompositeOperation = 'lighter';

      for (const p of magenta) {
        p.phase += 0.004 * p.speed;
        p.x += p.vx + Math.sin(p.phase) * 0.08;
        p.y += p.vy + Math.cos(p.phase * 0.7) * 0.08;
        if (p.x < -p.r || p.x > OW + p.r) p.vx *= -1;
        if (p.y < -p.r || p.y > OH + p.r) p.vy *= -1;
        blob(p.x, p.y, p.r, p.a);
      }

      clump.t += 0.0035;
      const cx = OW * (0.44 + 0.15 * Math.sin(clump.t * 0.9) + 0.07 * Math.sin(clump.t * 0.37 + 1.7));
      const cy = OH * (0.46 + 0.16 * Math.sin(clump.t * 0.7 + 0.5) + 0.08 * Math.cos(clump.t * 0.53));

      let gx = 0, gy = 0;
      const positions = [];
      for (const s of clump.parts) {
        s.lerp += s.lerpSpeed;
        if (s.lerp >= 1) {
          s.lerp = 0;
          s.current = { ...s.target };
          s.target = randomPart();
          s.lerpSpeed = 0.003 + Math.random() * 0.002;
        }

        const smoothT = s.lerp * s.lerp * (3 - 2 * s.lerp);
        const spin = lerp(s.current.spin, s.target.spin, smoothT);
        const dist = lerp(s.current.dist, s.target.dist, smoothT);
        const baseR = lerp(s.current.baseR, s.target.baseR, smoothT);
        const baseA = lerp(s.current.baseA, s.target.baseA, smoothT);
        const wavePhase = lerp(s.current.wavePhase, s.target.wavePhase, smoothT);

        s.ang += spin;
        const d = dist * (0.7 + 0.3 * Math.sin(clump.t * 2 + s.ang * 3));
        const x = cx + Math.cos(s.ang) * d;
        const y = cy + Math.sin(s.ang) * d * 0.9;
        gx += x;
        gy += y;
        positions.push({ x, y, baseR, baseA, wavePhase });
      }
      gx /= clump.parts.length;
      gy /= clump.parts.length;

      for (const p of positions) {
        const dx = p.x - gx, dy = p.y - gy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const close = Math.max(0, 1 - dist / 26);
        const pulse = Math.sin(clump.t * 3 + p.wavePhase) * 0.15;
        const r = p.baseR + close * 18 + pulse * 4;
        const a = p.baseA + close * 0.30 + pulse * 0.1;
        blob(p.x, p.y, r, a);
      }

      for (const dr of drops) {
        const x = OW * dr.bx + Math.sin(clump.t + dr.p) * 6;
        const y = OH * dr.by + Math.cos(clump.t * 0.8 + dr.p) * 5;
        const dx = x - gx, dy = y - gy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const close = Math.max(0, 1 - dist / 60);
        const pulse = Math.sin(clump.t * 2.5 + dr.p * 1.3) * 0.2;
        const r = dr.baseR + close * 12 + pulse * 3;
        const a = dr.baseA + close * 0.15 + pulse * 0.08;
        blob(x, y, r, a);
      }

      const img = octx.getImageData(0, 0, RW, RH);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        let t = d[i] / 255;
        t = t * t * (3 - 2 * t);
        t = t * t * (3 - 2 * t);
        const j = (t * 255) | 0;
        d[i]     = LUT[j * 3];
        d[i + 1] = LUT[j * 3 + 1];
        d[i + 2] = LUT[j * 3 + 2];
        d[i + 3] = 255;
      }
      octx.putImageData(img, 0, 0);

      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(off, 0, 0, width, height);

      requestAnimationFrame(drawFluid);
    }

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      ctx.imageSmoothingQuality = 'high';
    });

    requestAnimationFrame(drawFluid);
  </script>
</body>
</html>
